<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tinsukia Teer - Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f6fc;
  color:#172033;
}

header{
  background:#0d6efd;
  color:white;
  padding:18px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

header h1{
  margin:0;
  font-size:21px;
}

.logout{
  background:white;
  color:#0d6efd;
  border:0;
  padding:10px 15px;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.container{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.card h2{
  margin-top:0;
  color:#0757b8;
}

label{
  display:block;
  font-weight:bold;
  margin-top:14px;
  margin-bottom:6px;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #d5dfeb;
  border-radius:9px;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#0d6efd;
}

.round-box{
  background:#f8fbff;
  border:1px solid #dce8f7;
  padding:16px;
  border-radius:14px;
  margin-top:15px;
}

.round-title{
  font-size:18px;
  font-weight:bold;
  color:#0757b8;
  margin-bottom:10px;
}

.update-btn{
  width:100%;
  margin-top:12px;
  padding:14px;
  border:0;
  border-radius:9px;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.first-btn{
  background:#0d6efd;
}

.second-btn{
  background:#198754;
}

.update-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  text-align:center;
  margin-top:15px;
  font-weight:bold;
  min-height:20px;
}

.success{
  color:#16803c;
}

.error{
  color:#d93025;
}

.current{
  margin-top:8px;
  color:#667085;
  font-size:14px;
}

.current strong{
  color:#172033;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

th,td{
  padding:12px 8px;
  border-bottom:1px solid #e3e8ef;
  text-align:center;
}

th{
  background:#edf4ff;
  color:#0757b8;
}

.action-btn{
  border:0;
  padding:7px 10px;
  border-radius:6px;
  margin:2px;
  font-weight:bold;
  cursor:pointer;
}

.edit-first{
  background:#ffc107;
  color:#111;
}

.edit-second{
  background:#20c997;
  color:white;
}

.delete{
  background:#dc3545;
  color:white;
}

.empty{
  text-align:center;
  color:#777;
  padding:20px;
}

.xx{
  color:#777;
  letter-spacing:2px;
}

.info{
  background:#eef7ff;
  border-left:4px solid #0d6efd;
  padding:13px;
  border-radius:8px;
  margin-bottom:15px;
  color:#31506f;
  font-size:14px;
}

@media(max-width:600px){

  header h1{
    font-size:18px;
  }

  .container{
    padding:12px;
  }

  .card{
    padding:16px;
  }

  table{
    font-size:13px;
  }

  th,td{
    padding:9px 5px;
  }

  .action-btn{
    font-size:11px;
    padding:6px 7px;
  }
}
</style>
</head>

<body>

<header>

  <h1>🎯 Tinsukia Teer Admin</h1>

  <button class="logout" onclick="logout()">
    Logout
  </button>

</header>


<div class="container">

  <div class="card">

    <h2>📅 Update Result</h2>

    <div class="info">
      1st Round aur 2nd Round ko ab alag-alag update kar sakte ho.
      Ek round update karne se doosra round change nahi hoga.
    </div>

    <label for="resultDate">
      Date
    </label>

    <input
      type="date"
      id="resultDate"
    >


    <!-- FIRST ROUND -->

    <div class="round-box">

      <div class="round-title">
        🥇 1st Round
      </div>

      <input
        type="number"
        id="firstRound"
        min="0"
        max="99"
        inputmode="numeric"
        placeholder="Example: 26"
      >

      <div class="current">
        Current Result:
        <strong id="currentFirst">XX</strong>
      </div>

      <button
        id="firstButton"
        class="update-btn first-btn"
        onclick="saveRound('first')"
      >
        💾 Update 1st Round
      </button>

    </div>


    <!-- SECOND ROUND -->

    <div class="round-box">

      <div class="round-title">
        🥈 2nd Round
      </div>

      <input
        type="number"
        id="secondRound"
        min="0"
        max="99"
        inputmode="numeric"
        placeholder="Example: 19"
      >

      <div class="current">
        Current Result:
        <strong id="currentSecond">XX</strong>
      </div>

      <button
        id="secondButton"
        class="update-btn second-btn"
        onclick="saveRound('second')"
      >
        💾 Update 2nd Round
      </button>

    </div>


    <div
      id="message"
      class="message"
    ></div>

  </div>


  <!-- RESULT LIST -->

  <div class="card">

    <h2>📋 Previous Results</h2>

    <div id="resultsBox">
      Loading...
    </div>

  </div>

</div>


<script>

/* =====================================
   SUPABASE CONNECTION
===================================== */

const SUPABASE_URL =
"https://ihznspejlkvbplofdpyf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KNj6WGd8dbjEAXwrWe1_pA_zKAhHMpw";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================
   CHECK LOGIN
===================================== */

async function checkLogin(){

  const {
    data,
    error
  } = await supabaseClient.auth.getSession();

  if(error || !data.session){

    window.location.href = "admin.html";

    return;
  }

  loadResults();

}


/* =====================================
   LOGOUT
===================================== */

async function logout(){

  await supabaseClient.auth.signOut();

  window.location.href = "admin.html";

}


/* =====================================
   SET DEFAULT DATE
===================================== */

function setDefaultDate(){

  const dateInput =
    document.getElementById("resultDate");

  if(!dateInput.value){

    const now = new Date();

    const year =
      now.getFullYear();

    const month =
      String(now.getMonth() + 1)
        .padStart(2,"0");

    const day =
      String(now.getDate())
        .padStart(2,"0");

    dateInput.value =
      year + "-" + month + "-" + day;

  }

}


/* =====================================
   LOAD RESULT FOR SELECTED DATE
===================================== */

async function loadDateResult(){

  const date =
    document.getElementById("resultDate").value;

  if(!date){

    return;
  }

  const {
    data,
    error
  } = await supabaseClient
    .from("teer_results")
    .select("first_round, second_round")
    .eq("result_date", date)
    .maybeSingle();


  if(error){

    console.log(error);

    return;
  }


  if(data){

    document.getElementById("currentFirst")
      .textContent =
      data.first_round ?? "XX";

    document.getElementById("currentSecond")
      .textContent =
      data.second_round ?? "XX";

    document.getElementById("firstRound")
      .value =
      data.first_round ?? "";

    document.getElementById("secondRound")
      .value =
      data.second_round ?? "";

  }

  else{

    document.getElementById("currentFirst")
      .textContent = "XX";

    document.getElementById("currentSecond")
      .textContent = "XX";

    document.getElementById("firstRound")
      .value = "";

    document.getElementById("secondRound")
      .value = "";

  }

}


/* =====================================
   UPDATE ONLY ONE ROUND
===================================== */

async function saveRound(round){

  const date =
    document.getElementById("resultDate").value;

  const message =
    document.getElementById("message");


  message.textContent = "";

  message.className = "message";


  /* DATE CHECK */

  if(!date){

    message.textContent =
      "Please select a date.";

    message.classList.add("error");

    return;

  }


  let input;
  let button;
  let column;


  if(round === "first"){

    input =
      document.getElementById("firstRound");

    button =
      document.getElementById("firstButton");

    column =
      "first_round";

  }

  else{

    input =
      document.getElementById("secondRound");

    button =
      document.getElementById("secondButton");

    column =
      "second_round";

  }


  const value =
    input.value.trim();


  /* RESULT CHECK */

  if(value === ""){

    message.textContent =
      "Result bharo.";

    message.classList.add("error");

    return;

  }


  const number =
    parseInt(value,10);


  if(
    isNaN(number) ||
    number < 0 ||
    number > 99
  ){

    message.textContent =
      "Result 0 se 99 ke beech hona chahiye.";

    message.classList.add("error");

    return;

  }


  /* LOADING */

  button.disabled = true;
  button.textContent = "Updating...";


  try{

    /* FIND DATE */

    const {
      data: existing,
      error: checkError
    } = await supabaseClient
      .from("teer_results")
      .select("id")
      .eq("result_date", date)
      .maybeSingle();


    if(checkError){

      throw checkError;

    }


    let result;


    /* =================================
       EXISTING DATE
       UPDATE ONLY SELECTED ROUND
    ================================= */

    if(existing){

      const updateData = {};

      updateData[column] = number;


      result =
        await supabaseClient
          .from("teer_results")
          .update(updateData)
          .eq("id", existing.id);

    }


    /* =================================
       NEW DATE
       INSERT ONLY SELECTED ROUND
    ================================= */

    else{

      const insertData = {

        result_date: date

      };

      insertData[column] = number;


      result =
        await supabaseClient
          .from("teer_results")
          .insert(insertData);

    }


    if(result.error){

      throw result.error;

    }


    /* SUCCESS */

    if(round === "first"){

      document.getElementById("currentFirst")
        .textContent = number;

    }

    else{

      document.getElementById("currentSecond")
        .textContent = number;

    }


    message.textContent =
      round === "first"
        ? "✅ 1st Round updated successfully!"
        : "✅ 2nd Round updated successfully!";

    message.classList.add("success");


    loadResults();


  }catch(error){

    console.error(error);

    message.textContent =
      "Update failed: " + error.message;

    message.classList.add("error");

  }


  button.disabled = false;

  button.textContent =
    round === "first"
      ? "💾 Update 1st Round"
      : "💾 Update 2nd Round";

}


/* =====================================
   LOAD ALL RESULTS
===================================== */

async function loadResults(){

  const box =
    document.getElementById("resultsBox");

  box.innerHTML = "Loading...";


  const {
    data,
    error
  } = await supabaseClient
    .from("teer_results")
    .select("*")
    .order("result_date", {
      ascending:false
    });


  if(error){

    box.innerHTML =
      `<div class="error">
        Error loading results:<br>
        ${escapeHtml(error.message)}
      </div>`;

    return;

  }


  if(!data || data.length === 0){

    box.innerHTML =
      `<div class="empty">
        No results added yet.
      </div>`;

    return;

  }


  let html = `

    <div style="overflow-x:auto">

    <table>

      <thead>

        <tr>

          <th>Date</th>

          <th>1st Round</th>

          <th>2nd Round</th>

          <th>Action</th>

        </tr>

      </thead>

      <tbody>

  `;


  data.forEach(row => {

    const first =
      row.first_round ?? "XX";

    const second =
      row.second_round ?? "XX";


    html += `

      <tr>

        <td>
          ${formatDate(row.result_date)}
        </td>

        <td>
          <strong>
            ${escapeHtml(String(first))}
          </strong>
        </td>

        <td>
          <strong class="${
            second === "XX" ? "xx" : ""
          }">
            ${escapeHtml(String(second))}
          </strong>
        </td>

        <td>

          <button
            class="action-btn edit-first"
            onclick="editRound(
              '${row.result_date}',
              'first',
              '${row.first_round ?? ""}'
            )"
          >
            1st Edit
          </button>

          <button
            class="action-btn edit-second"
            onclick="editRound(
              '${row.result_date}',
              'second',
              '${row.second_round ?? ""}'
            )"
          >
            2nd Edit
          </button>

          <button
            class="action-btn delete"
            onclick="deleteResult(${row.id})"
          >
            Delete
          </button>

        </td>

      </tr>

    `;

  });


  html += `

      </tbody>

    </table>

    </div>

  `;


  box.innerHTML = html;

}


/* =====================================
   EDIT ONE ROUND
===================================== */

function editRound(
  date,
  round,
  value
){

  document.getElementById("resultDate")
    .value = date;


  loadDateResult();


  setTimeout(function(){

    if(round === "first"){

      document.getElementById("firstRound")
        .value =
        value === "" ? "" : value;

      document.getElementById("firstRound")
        .focus();

    }

    else{

      document.getElementById("secondRound")
        .value =
        value === "" ? "" : value;

      document.getElementById("secondRound")
        .focus();

    }

  },300);


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =====================================
   DELETE RESULT
===================================== */

async function deleteResult(id){

  const confirmDelete =
    confirm(
      "Kya aap ye poora date ka result delete karna chahte ho?"
    );


  if(!confirmDelete){

    return;

  }


  const {
    error
  } = await supabaseClient
    .from("teer_results")
    .delete()
    .eq("id",id);


  if(error){

    alert(
      "Delete failed: " +
      error.message
    );

    return;

  }


  alert(
    "✅ Result deleted successfully!"
  );


  loadResults();

}


/* =====================================
   DATE FORMAT
===================================== */

function formatDate(dateString){

  if(!dateString){

    return "-";

  }


  const parts =
    dateString.split("-");


  if(parts.length !== 3){

    return dateString;

  }


  return (
    parts[2] +
    " " +
    monthName(parts[1]) +
    " " +
    parts[0]
  );

}


function monthName(month){

  const months = [
    "Jan",
    "Feb",
    "Mar",
    "Apr",
    "May",
    "Jun",
    "Jul",
    "Aug",
    "Sep",
    "Oct",
    "Nov",
    "Dec"
  ];


  return months[
    parseInt(month,10) - 1
  ];

}


/* =====================================
   HTML SECURITY
===================================== */

function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =====================================
   DATE CHANGE
===================================== */

document
  .getElementById("resultDate")
  .addEventListener(
    "change",
    loadDateResult
  );


/* =====================================
   START
===================================== */

setDefaultDate();

checkLogin();

</script>

</body>
</html>
