<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tinsukia Teer - Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f6fc;
  color:#172033;
}

header{
  background:#0d6efd;
  color:white;
  padding:18px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

header h1{
  margin:0;
  font-size:21px;
}

.logout{
  background:white;
  color:#0d6efd;
  border:0;
  padding:10px 15px;
  border-radius:8px;
  font-weight:bold;
}

.container{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.card h2{
  margin-top:0;
  color:#0757b8;
}

label{
  display:block;
  font-weight:bold;
  margin-top:14px;
  margin-bottom:6px;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #d5dfeb;
  border-radius:9px;
  font-size:16px;
}

.save-btn{
  width:100%;
  margin-top:20px;
  padding:14px;
  background:#0d6efd;
  color:white;
  border:0;
  border-radius:9px;
  font-size:17px;
  font-weight:bold;
}

.message{
  text-align:center;
  margin-top:15px;
  font-weight:bold;
}

.success{
  color:#16803c;
}

.error{
  color:#d93025;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

th,td{
  padding:12px 8px;
  border-bottom:1px solid #e3e8ef;
  text-align:center;
}

th{
  background:#edf4ff;
  color:#0757b8;
}

.action-btn{
  border:0;
  padding:7px 10px;
  border-radius:6px;
  margin:2px;
  font-weight:bold;
}

.edit{
  background:#ffc107;
  color:#111;
}

.delete{
  background:#dc3545;
  color:white;
}

.empty{
  text-align:center;
  color:#777;
  padding:20px;
}

@media(max-width:600px){

  header h1{
    font-size:18px;
  }

  .container{
    padding:12px;
  }

  .card{
    padding:16px;
  }

  table{
    font-size:13px;
  }

  th,td{
    padding:9px 5px;
  }
}
</style>
</head>

<body>

<header>

  <h1>🎯 Tinsukia Teer Admin</h1>

  <button class="logout" onclick="logout()">
    Logout
  </button>

</header>


<div class="container">

  <!-- ADD RESULT -->

  <div class="card">

    <h2>📅 Add / Update Result</h2>

    <label for="resultDate">
      Date
    </label>

    <input
      type="date"
      id="resultDate"
    >

    <label for="firstRound">
      First Round
    </label>

    <input
      type="number"
      id="firstRound"
      min="0"
      max="99"
      placeholder="Example: 26"
    >

    <label for="secondRound">
      Second Round
    </label>

    <input
      type="number"
      id="secondRound"
      min="0"
      max="99"
      placeholder="Example: 19"
    >

    <button
      class="save-btn"
      onclick="saveResult()"
    >
      💾 Save Result
    </button>

    <div
      id="message"
      class="message"
    ></div>

  </div>


  <!-- RESULT LIST -->

  <div class="card">

    <h2>📋 Previous Results</h2>

    <div id="resultsBox">
      Loading...
    </div>

  </div>

</div>


<script>

/* =====================================
   SUPABASE CONNECTION
===================================== */

const SUPABASE_URL =
"https://ihznspejlkvbplofdpyf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KNj6WGd8dbjEAXwrWe1_pA_zKAhHMpw";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================
   CHECK LOGIN
===================================== */

async function checkLogin(){

  const {
    data,
    error
  } = await supabaseClient.auth.getSession();

  if(error){

    console.log(error);

    window.location.href =
      "admin.html";

    return;
  }

  if(!data.session){

    window.location.href =
      "admin.html";

    return;
  }

  loadResults();
}


/* =====================================
   LOGOUT
===================================== */

async function logout(){

  await supabaseClient.auth.signOut();

  window.location.href =
    "admin.html";
}


/* =====================================
   SAVE / UPDATE RESULT
===================================== */

async function saveResult(){

  const date =
    document.getElementById("resultDate").value;

  const first =
    document.getElementById("firstRound").value;

  const second =
    document.getElementById("secondRound").value;

  const message =
    document.getElementById("message");


  message.textContent = "";
  message.className = "message";


  /* VALIDATION */

  if(!date){

    message.textContent =
      "Please select a date.";

    message.classList.add("error");

    return;
  }


  if(first === "" || second === ""){

    message.textContent =
      "First Round aur Second Round dono bharo.";

    message.classList.add("error");

    return;
  }


  const firstNumber =
    parseInt(first);

  const secondNumber =
    parseInt(second);


  if(
    firstNumber < 0 ||
    firstNumber > 99 ||
    secondNumber < 0 ||
    secondNumber > 99
  ){

    message.textContent =
      "Result 0 se 99 ke beech hona chahiye.";

    message.classList.add("error");

    return;
  }


  /* CHECK WHETHER DATE ALREADY EXISTS */

  const {
    data: existing,
    error: checkError
  } = await supabaseClient
    .from("teer_results")
    .select("id")
    .eq("result_date", date)
    .maybeSingle();


  if(checkError){

    message.textContent =
      "Error: " + checkError.message;

    message.classList.add("error");

    return;
  }


  let error;


  /* UPDATE */

  if(existing){

    const result =
      await supabaseClient
        .from("teer_results")
        .update({
          first_round: firstNumber,
          second_round: secondNumber
        })
        .eq("id", existing.id);

    error = result.error;

  }

  /* INSERT */

  else{

    const result =
      await supabaseClient
        .from("teer_results")
        .insert({
          result_date: date,
          first_round: firstNumber,
          second_round: secondNumber
        });

    error = result.error;

  }


  if(error){

    message.textContent =
      "Save failed: " + error.message;

    message.classList.add("error");

    return;
  }


  message.textContent =
    existing
      ? "✅ Result updated successfully!"
      : "✅ Result saved successfully!";

  message.classList.add("success");


  /* CLEAR */

  document.getElementById("firstRound").value = "";
  document.getElementById("secondRound").value = "";


  loadResults();
}


/* =====================================
   LOAD RESULTS
===================================== */

async function loadResults(){

  const box =
    document.getElementById("resultsBox");

  box.innerHTML = "Loading...";


  const {
    data,
    error
  } = await supabaseClient
    .from("teer_results")
    .select("*")
    .order("result_date", {
      ascending:false
    });


  if(error){

    box.innerHTML =
      `<div class="error">
        Error loading results:<br>
        ${escapeHtml(error.message)}
      </div>`;

    return;
  }


  if(!data || data.length === 0){

    box.innerHTML =
      `<div class="empty">
        No results added yet.
      </div>`;

    return;
  }


  let html = `

    <div style="overflow-x:auto">

    <table>

      <thead>

        <tr>

          <th>Date</th>

          <th>First Round</th>

          <th>Second Round</th>

          <th>Action</th>

        </tr>

      </thead>

      <tbody>
  `;


  data.forEach(row => {

    html += `

      <tr>

        <td>
          ${formatDate(row.result_date)}
        </td>

        <td>
          <strong>
            ${row.first_round ?? "-"}
          </strong>
        </td>

        <td>
          <strong>
            ${row.second_round ?? "-"}
          </strong>
        </td>

        <td>

          <button
            class="action-btn edit"
            onclick="editResult(
              '${row.result_date}',
              '${row.first_round ?? ""}',
              '${row.second_round ?? ""}'
            )"
          >
            Edit
          </button>

          <button
            class="action-btn delete"
            onclick="deleteResult(${row.id})"
          >
            Delete
          </button>

        </td>

      </tr>

    `;

  });


  html += `

      </tbody>

    </table>

    </div>

  `;


  box.innerHTML = html;
}


/* =====================================
   EDIT RESULT
===================================== */

function editResult(
  date,
  first,
  second
){

  document.getElementById(
    "resultDate"
  ).value = date;

  document.getElementById(
    "firstRound"
  ).value = first;

  document.getElementById(
    "secondRound"
  ).value = second;


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* =====================================
   DELETE RESULT
===================================== */

async function deleteResult(id){

  const confirmDelete =
    confirm(
      "Kya aap ye result delete karna chahte ho?"
    );


  if(!confirmDelete){
    return;
  }


  const {
    error
  } = await supabaseClient
    .from("teer_results")
    .delete()
    .eq("id", id);


  if(error){

    alert(
      "Delete failed: " +
      error.message
    );

    return;
  }


  alert(
    "✅ Result deleted successfully!"
  );


  loadResults();
}


/* =====================================
   DATE FORMAT
===================================== */

function formatDate(dateString){

  if(!dateString){
    return "-";
  }

  const parts =
    dateString.split("-");

  if(parts.length !== 3){
    return dateString;
  }

  return (
    parts[2] +
    " " +
    monthName(parts[1]) +
    " " +
    parts[0]
  );
}


function monthName(month){

  const months = [
    "Jan",
    "Feb",
    "Mar",
    "Apr",
    "May",
    "Jun",
    "Jul",
    "Aug",
    "Sep",
    "Oct",
    "Nov",
    "Dec"
  ];

  return months[
    parseInt(month) - 1
  ];
}


/* =====================================
   HTML SECURITY
===================================== */

function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =====================================
   START
===================================== */

checkLogin();

</script>

</body>
</html>
