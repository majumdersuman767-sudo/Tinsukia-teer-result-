<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tinsukia Teer Admin Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f6fc;
  color:#172033;
}

header{
  background:#0d6efd;
  color:white;
  padding:18px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 3px 12px rgba(0,0,0,.12);
}

header h1{
  margin:0;
  font-size:22px;
}

.logout{
  width:auto;
  margin:0;
  padding:10px 16px;
  background:white;
  color:#0d6efd;
  border-radius:8px;
  border:0;
  font-weight:bold;
}

.container{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:20px;
}

.card{
  background:white;
  border-radius:18px;
  padding:22px;
  margin-bottom:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.card h2{
  margin-top:0;
  color:#0757b8;
}

label{
  display:block;
  font-weight:bold;
  margin-top:14px;
  margin-bottom:6px;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #ccd7e5;
  border-radius:10px;
  font-size:16px;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

button{
  border:0;
  border-radius:10px;
  padding:13px 18px;
  background:#0d6efd;
  color:white;
  font-size:16px;
  font-weight:bold;
  margin-top:18px;
}

button.secondary{
  background:#6c757d;
}

button.danger{
  background:#dc3545;
}

#message{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  display:none;
}

.success{
  background:#dff6e5;
  color:#146c2e;
}

.error{
  background:#ffe1e1;
  color:#a11b1b;
}

.result-item{
  border:1px solid #dbe4ef;
  border-radius:14px;
  padding:16px;
  margin-top:12px;
}

.result-date{
  font-weight:bold;
  color:#0757b8;
  font-size:18px;
}

.numbers{
  display:flex;
  gap:20px;
  margin-top:12px;
}

.number-box{
  flex:1;
  text-align:center;
  background:#f1f6fc;
  border-radius:12px;
  padding:12px;
}

.number-box small{
  display:block;
  color:#667085;
}

.number-box strong{
  display:block;
  color:#0d6efd;
  font-size:32px;
  margin-top:5px;
}

.actions{
  display:flex;
  gap:10px;
}

.actions button{
  flex:1;
}

.loading{
  text-align:center;
  color:#667085;
  padding:20px;
}

@media(max-width:600px){

  .row{
    grid-template-columns:1fr;
  }

  .numbers{
    flex-direction:column;
    gap:10px;
  }

  header h1{
    font-size:18px;
  }

  .container{
    padding:12px;
  }
}
</style>
</head>

<body>

<header>
  <h1>TT Admin Dashboard</h1>
  <button class="logout" onclick="logout()">Logout</button>
</header>

<div class="container">

  <!-- ADD / UPDATE RESULT -->
  <div class="card">

    <h2 id="formTitle">Add Daily Result</h2>

    <label>Date</label>
    <input type="date" id="resultDate">

    <div class="row">

      <div>
        <label>First Round</label>
        <input
          type="number"
          id="firstRound"
          min="0"
          max="99"
          placeholder="Example: 26"
        >
      </div>

      <div>
        <label>Second Round</label>
        <input
          type="number"
          id="secondRound"
          min="0"
          max="99"
          placeholder="Example: 19"
        >
      </div>

    </div>

    <button onclick="saveResult()" id="saveButton">
      Save Result
    </button>

    <button
      onclick="cancelEdit()"
      class="secondary"
      id="cancelButton"
      style="display:none;"
    >
      Cancel Edit
    </button>

    <div id="message"></div>

  </div>


  <!-- PREVIOUS RESULTS -->

  <div class="card">

    <h2>Previous Results</h2>

    <label>Search by Date</label>

    <input
      type="date"
      id="searchDate"
      onchange="loadResults()"
    >

    <button
      onclick="clearSearch()"
      class="secondary"
    >
      Show All
    </button>

    <div id="resultsList">
      <div class="loading">
        Loading results...
      </div>
    </div>

  </div>

</div>


<script>

/* ================================
   SUPABASE CONFIG
================================ */

const SUPABASE_URL =
"https://ihznspejlkvbplofdpyf.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KNj6WGd8dbjEAXwrWe1_pA_zKAhHMpw";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ================================
   VARIABLES
================================ */

let editingId = null;


/* ================================
   PAGE START
================================ */

document.addEventListener("DOMContentLoaded", async function(){

  const today = new Date();

  const yyyy = today.getFullYear();
  const mm = String(today.getMonth()+1).padStart(2,"0");
  const dd = String(today.getDate()).padStart(2,"0");

  document.getElementById("resultDate").value =
    `${yyyy}-${mm}-${dd}`;

  await checkLogin();

});


/* ================================
   CHECK LOGIN
================================ */

async function checkLogin(){

  const {
    data,
    error
  } = await supabaseClient.auth.getSession();

  if(error || !data.session){

    window.location.href = "admin.html";

    return;
  }

  loadResults();
}


/* ================================
   SAVE RESULT
================================ */

async function saveResult(){

  const date =
    document.getElementById("resultDate").value;

  const first =
    document.getElementById("firstRound").value.trim();

  const second =
    document.getElementById("secondRound").value.trim();

  if(!date){

    showMessage(
      "Date select karo.",
      "error"
    );

    return;
  }

  if(first === "" || second === ""){

    showMessage(
      "First Round aur Second Round dono bharo.",
      "error"
    );

    return;
  }

  const firstNumber = Number(first);
  const secondNumber = Number(second);

  if(
    firstNumber < 0 ||
    firstNumber > 99 ||
    secondNumber < 0 ||
    secondNumber > 99
  ){

    showMessage(
      "Result number 0 se 99 ke beech hona chahiye.",
      "error"
    );

    return;
  }


  /* UPDATE */

  if(editingId){

    const {
      error
    } = await supabaseClient
      .from("teer_results")
      .update({
        result_date:date,
        first_round:firstNumber,
        second_round:secondNumber
      })
      .eq("id",editingId);

    if(error){

      showMessage(
        "Update failed: " + error.message,
        "error"
      );

      return;
    }

    showMessage(
      "Result successfully updated.",
      "success"
    );

  }

  /* INSERT */

  else{

    const {
      data:existing,
      error:checkError
    } = await supabaseClient
      .from("teer_results")
      .select("id")
      .eq("result_date",date)
      .maybeSingle();


    if(checkError){

      showMessage(
        "Checking result failed: " +
        checkError.message,
        "error"
      );

      return;
    }


    if(existing){

      showMessage(
        "Is date ka result already hai. Edit option use karo.",
        "error"
      );

      return;
    }


    const {
      error
    } = await supabaseClient
      .from("teer_results")
      .insert({
        result_date:date,
        first_round:firstNumber,
        second_round:secondNumber
      });


    if(error){

      showMessage(
        "Save failed: " + error.message,
        "error"
      );

      return;
    }

    showMessage(
      "Result successfully saved.",
      "success"
    );

  }


  cancelEdit();

  loadResults();

}


/* ================================
   LOAD RESULTS
================================ */

async function loadResults(){

  const list =
    document.getElementById("resultsList");

  list.innerHTML =
    '<div class="loading">Loading results...</div>';


  const searchDate =
    document.getElementById("searchDate").value;


  let query =
    supabaseClient
      .from("teer_results")
      .select("*")
      .order("result_date",{ascending:false});


  if(searchDate){

    query =
      query.eq("result_date",searchDate);

  }


  const {
    data,
    error
  } = await query;


  if(error){

    list.innerHTML =
      `<div class="error" style="display:block">
        ${escapeHtml(error.message)}
      </div>`;

    return;
  }


  if(!data || data.length === 0){

    list.innerHTML =
      '<div class="loading">No results found.</div>';

    return;
  }


  list.innerHTML = "";


  data.forEach(result => {

    const div =
      document.createElement("div");

    div.className = "result-item";


    const date =
      formatDate(result.result_date);


    div.innerHTML = `

      <div class="result-date">
        ${date}
      </div>

      <div class="numbers">

        <div class="number-box">
          <small>FIRST ROUND</small>
          <strong>
            ${escapeHtml(String(result.first_round))}
          </strong>
        </div>

        <div class="number-box">
          <small>SECOND ROUND</small>
          <strong>
            ${escapeHtml(String(result.second_round))}
          </strong>
        </div>

      </div>

      <div class="actions">

        <button
          onclick="editResult('${result.id}')"
        >
          Edit
        </button>

        <button
          class="danger"
          onclick="deleteResult('${result.id}')"
        >
          Delete
        </button>

      </div>

    `;


    list.appendChild(div);

  });

}


/* ================================
   EDIT RESULT
================================ */

async function editResult(id){

  const {
    data,
    error
  } = await supabaseClient
    .from("teer_results")
    .select("*")
    .eq("id",id)
    .single();


  if(error){

    showMessage(
      "Could not load result: " +
      error.message,
      "error"
    );

    return;
  }


  editingId = id;


  document.getElementById("resultDate").value =
    data.result_date;

  document.getElementById("firstRound").value =
    data.first_round;

  document.getElementById("secondRound").value =
    data.second_round;


  document.getElementById("formTitle").textContent =
    "Edit Daily Result";

  document.getElementById("saveButton").textContent =
    "Update Result";

  document.getElementById("cancelButton").style.display =
    "block";


  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* ================================
   CANCEL EDIT
================================ */

function cancelEdit(){

  editingId = null;


  document.getElementById("formTitle").textContent =
    "Add Daily Result";

  document.getElementById("saveButton").textContent =
    "Save Result";

  document.getElementById("cancelButton").style.display =
    "none";


  document.getElementById("firstRound").value = "";

  document.getElementById("secondRound").value = "";


  const today = new Date();

  const yyyy = today.getFullYear();
  const mm = String(today.getMonth()+1).padStart(2,"0");
  const dd = String(today.getDate()).padStart(2,"0");

  document.getElementById("resultDate").value =
    `${yyyy}-${mm}-${dd}`;
}


/* ================================
   DELETE RESULT
================================ */

async function deleteResult(id){

  const confirmDelete =
    confirm(
      "Kya aap ye result delete karna chahte ho?"
    );


  if(!confirmDelete){

    return;
  }


  const {
    error
  } = await supabaseClient
    .from("teer_results")
    .delete()
    .eq("id",id);


  if(error){

    showMessage(
      "Delete failed: " +
      error.message,
      "error"
    );

    return;
  }


  showMessage(
    "Result deleted.",
    "success"
  );


  loadResults();

}


/* ================================
   LOGOUT
================================ */

async function logout(){

  await supabaseClient.auth.signOut();

  window.location.href = "admin.html";

}


/* ================================
   SEARCH CLEAR
================================ */

function clearSearch(){

  document.getElementById("searchDate").value = "";

  loadResults();

}


/* ================================
   MESSAGE
================================ */

function showMessage(text,type){

  const box =
    document.getElementById("message");

  box.textContent = text;

  box.className = "";

  box.classList.add(type);

  box.style.display = "block";


  setTimeout(function(){

    box.style.display = "none";

  },4000);

}


/* ================================
   DATE FORMAT
================================ */

function formatDate(dateString){

  const date =
    new Date(dateString + "T00:00:00");

  return date.toLocaleDateString(
    "en-IN",
    {
      day:"2-digit",
      month:"short",
      year:"numeric"
    }
  );

}


/* ================================
   HTML SECURITY
================================ */

function escapeHtml(text){

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}

</script>

</body>
</html>
